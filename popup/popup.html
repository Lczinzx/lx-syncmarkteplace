<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LX Sync Marketplace</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-card">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <div>
          <h1>LX Sync</h1>
          <span class="sub">Multichannel Stock</span>
        </div>
      </div>
      <button id="open-dashboard-btn" class="btn-icon" title="Abrir Dashboard Completo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>
    </header>

    <!-- Channels Status Pills -->
    <div class="channels-bar">
      <div class="channel-pill meli" id="pill-meli">
        <span class="dot"></span> MeLi
      </div>
      <div class="channel-pill shopee" id="pill-shopee">
        <span class="dot"></span> Shopee
      </div>
      <div class="channel-pill tiktok" id="pill-tiktok">
        <span class="dot"></span> TikTok
      </div>
    </div>

    <!-- Quick Action Button -->
    <div class="action-section" style="display: flex; flex-direction: column; gap: 8px;">
      <button id="sync-now-btn" class="btn-primary glow-button">
        <svg class="spin-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span id="sync-btn-text">Sincronizar Estoque Agora</span>
      </button>
      <button id="btn-quick-multipost" class="btn-primary" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #F87171; box-shadow: none;">
        🚀 Criar Anúncio Multi-Post
      </button>
      <div id="sync-status-msg" class="status-msg">Pronto para sincronizar</div>
    </div>

    <!-- Quick Stock Overview -->
    <div class="section-title">SKUs com Menor Estoque</div>
    <div id="quick-skus-list" class="quick-list">
      <!-- Injetado dinamicamente -->
      <div class="loading">Carregando estoque...</div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="mode-badge" id="demo-indicator">⚡ Modo Demo Ativo</div>
      <a href="#" id="open-settings-link">Configurações</a>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
